<button (click)="teacherService.addTeacher()">
  Add Teacher
</button>

<br/>

@if (teacherService.showForm) {
  <app-form
    [data]="teacherService.data"
    (save)="teacherService.saveTeacher($event)">
  </app-form>
}
<app-table
  [data]="teacherService.teachers"
  (delete)="teacherService.deleteTeacher($event)"
  (edit)="teacherService.editTeacher($event)">
</app-table>

<button class="btn btn-secondary" routerLink="/dashboard">
  Back to Dashboard
</button>
