<!-- Add Teacher Button -->
<button
  class="btn btn-primary mb-3"
  data-bs-toggle="modal"
  data-bs-target="#exampleModal"
  (click)="teacherService.addTeacher()">
  Add Teacher
</button>

<!-- Teacher Table -->
<app-table
  [data]="teachers"
  (edit)="editData($event)"
  (delete)="teacherService.deleteTeacher($event)"
  (view)="viewTeacher($event)">
</app-table>

<!-- Go to Dashboard Button -->
<button class="btn btn-secondary mt-3" (click)="goToHome()">
  Go to Dashboard
</button>

<!-- Modal for Add/Edit Teacher -->
<div class="modal fade" id="exampleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          {{ teacherService.editIndex === null ? 'Add Teacher' : 'Edit Teacher' }}
        </h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        @if (teacherService.showForm) {
          <app-form
            [data]="teacherService.data"
            (save)="saveTeacher($event)">
          </app-form>
        }
      </div>

    </div>
  </div>
</div>
