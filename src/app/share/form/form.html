<form>
  Name: <input [(ngModel)]="data.name" name="name"><br>
  Phone: <input [(ngModel)]="data.phone" name="phone"><br>
  Email: <input [(ngModel)]="data.email" name="email"><br>
  Address: <input [(ngModel)]="data.address" name="address"><br>

  Gender:
  <input type="radio" value="male" name="gender" [(ngModel)]="data.gender"> Male
  <input type="radio" value="female" name="gender" [(ngModel)]="data.gender"> Female
  <br><br>

  <button type="button" (click)="submit()">
    {{ editIndex === null ? 'Save' : 'Update' }}
  </button>
</form>
