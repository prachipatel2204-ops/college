<button
  class="btn btn-primary mb-3"
  data-bs-toggle="modal"
  data-bs-target="#exampleModal"
  (click)="studService.addStudent()">
  Add Student
</button>

<app-table
  [data]="students"
  (edit)="editdata($event)"
  (delete)="studService.deleteStudent($event)"
  (view)="viewStudent($event)">
</app-table>

<button class="btn btn-secondary mt-3" (click)="gotohome()">
  Go to Dashboard
</button>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          {{ studService.editIndex === null ? 'Add Student' : 'Edit Student' }}
        </h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        @if (studService.showForm) {
          <app-form
            [data]="studService.data"
            (save)="savestudent($event)">
          </app-form>
        }
      </div>

    </div>
  </div>
</div>
